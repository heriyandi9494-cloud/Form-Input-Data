
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulir Online</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #f5f7ff;
      background:
        radial-gradient(circle at top, #26356a, transparent 50%),
        #080d1b;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 30px;
      border: 1px solid #35477a;
      border-radius: 22px;
      background: rgba(16, 24, 48, .96);
      box-shadow: 0 18px 60px #0007;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 17px;
      background: #233d79;
      font-size: 28px;
    }

    h1 { margin: 0 0 10px; font-size: 27px; }
    .subtitle {
      margin: 0 0 25px;
      color: #aab6d4;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 13px;
      font-weight: bold;
      color: #dbe4ff;
    }

    input, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #35466d;
      border-radius: 10px;
      outline: none;
      background: #0c1429;
      color: white;
      font: inherit;
    }

    input:focus, textarea:focus {
      border-color: #83a5ff;
      box-shadow: 0 0 0 3px #5379ff22;
    }

    textarea { min-height: 100px; resize: vertical; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(100deg, #4776ff, #8055ed);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 20px;
      color: #8795b7;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">✦</div>
    <h1>Formulir Online</h1>
    <p class="subtitle">
      Silakan isi data dengan benar, kemudian tekan tombol
      kirim untuk meneruskan data ke sistem.
    </p>

    <form id="dataForm">
      <label for="username">Username</label>
      <input id="username" name="username"
        placeholder="Masukkan username" required maxlength="100">

      <label for="email">Email</label>
      <input id="email" name="email" type="email"
        placeholder="nama@email.com" required maxlength="200">

      <label for="pesan">Pesan</label>
      <textarea id="pesan" name="pesan"
        placeholder="Tulis pesan di sini" required maxlength="3000"></textarea>

      <button id="submitBtn" type="submit">KIRIM DATA →</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <p class="note">
      Formulir ini menggunakan Google Apps Script untuk
      meneruskan data ke Google Sheets.
    </p>
  </main>

  <script>
    const SCRIPT_URL = "GANTI_DENGAN_URL_WEB_APP";

    const form = document.getElementById("dataForm");
    const button = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    function showStatus(message, color) {
      statusBox.style.display = "block";
      statusBox.style.background = "#ffffff0d";
      statusBox.style.color = color;
      statusBox.textContent = message;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!SCRIPT_URL.startsWith("https://script.google.com/")) {
        showStatus("Masukkan URL Web App Apps Script yang benar.", "#ffaaaa");
        return;
      }

      const data = {
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        pesan: document.getElementById("pesan").value.trim()
      };

      if (!data.username || !data.email || !data.pesan) {
        showStatus("Mohon isi semua kolom.", "#ffaaaa");
        return;
      }

      button.disabled = true;
      button.textContent = "MENGIRIM...";
      showStatus("Mengirim permintaan ke Google Apps Script...", "#dce6ff");

      try {
        const body = new URLSearchParams();
        body.append("payload", JSON.stringify(data));

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: body
        });

        showStatus(
          "Permintaan pengiriman telah dikirim. Karena browser membatasi pembacaan respons, status penyimpanan belum dapat dipastikan. Periksa tab Data di Google Sheets sebelum mengirim ulang.",
          "#ffe29a"
        );

        form.reset();
      } catch (error) {
        showStatus(
          "Pengiriman gagal dimulai. Periksa koneksi internet dan URL Apps Script, lalu coba lagi.",
          "#ffaaaa"
        );
      } finally {
        button.disabled = false;
        button.textContent = "KIRIM DATA →";
      }
    });
  </script>
</body>
</html>
