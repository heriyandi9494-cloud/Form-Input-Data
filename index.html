```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulir Data</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:30px 15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  color:#171717;
  background:linear-gradient(135deg,#fffdf7,#ffffff,#fff9e8);
}

.container{
  width:100%;
  max-width:520px;
  padding:28px;
  border:1.5px solid #d4af37;
  border-radius:20px;
  background:#fff;
  box-shadow:0 10px 35px #b89a3020;
  position:relative;
  overflow:hidden;
}

.container:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg,#a98216,#f8e7a0,#d4af37);
}

.logo{
  width:55px;
  height:55px;
  display:grid;
  place-items:center;
  border:1px solid #d4af37;
  border-radius:15px;
  background:#fff9e8;
  color:#a98216;
  font-size:27px;
  margin-bottom:18px;
}

h1{
  margin:0 0 10px;
  font-size:26px;
  color:#111;
}

.subtitle{
  color:#666;
  font-size:14px;
  line-height:1.6;
  margin-bottom:22px;
}

.form-card{
  margin-bottom:14px;
  padding:14px;
  border:1px solid #d4af37;
  border-radius:13px;
  background:#fff;
  transition:.2s;
}

.form-card:focus-within{
  box-shadow:0 0 0 3px #d4af3720;
  border-color:#a98216;
}

label{
  display:block;
  margin-bottom:9px;
  font-size:13px;
  font-weight:bold;
  color:#222;
}

input,textarea,select{
  display:block;
  width:100%;
  padding:12px;
  border:1px solid #dedede;
  border-radius:9px;
  background:#fff;
  color:#171717;
  font-family:Arial,sans-serif;
  font-size:14px;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:#d4af37;
}

input::placeholder,textarea::placeholder{
  color:#999;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:8px;
  padding:15px;
  border:1px solid #bd941f;
  border-radius:11px;
  background:linear-gradient(110deg,#e8ce72,#d4af37,#c69a20);
  color:#171717;
  font-size:14px;
  font-weight:bold;
  letter-spacing:.5px;
  cursor:pointer;
  transition:.2s;
}

button:hover:not(:disabled){
  filter:brightness(1.04);
  transform:translateY(-1px);
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

#status{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

#status.info{
  display:block;
  color:#755c12;
  background:#fffbec;
  border:1px solid #e4d29a;
}

#status.success{
  display:block;
  color:#18794e;
  background:#effaf3;
  border:1px solid #a8d8bd;
}

#status.error{
  display:block;
  color:#b42318;
  background:#fff2f2;
  border:1px solid #efb4b4;
}

.note{
  margin-top:20px;
  padding:13px;
  border:1px solid #ead79a;
  border-radius:11px;
  background:#fffdf6;
  text-align:center;
  font-size:12px;
  line-height:1.7;
  color:#76643a;
}

@media(max-width:480px){
  body{padding:15px 10px;align-items:flex-start}
  .container{padding:22px 16px}
  h1{font-size:24px}
}
</style>
</head>

<body>
<main class="container">

  <div class="logo">✦</div>

  <h1>Formulir Data</h1>

  <p class="subtitle">
    Silakan isi seluruh informasi pada formulir berikut
    sesuai data yang benar.
  </p>

  <form id="dataForm">

    <div class="form-card">
      <label for="username">Username</label>
      <input id="username" name="username"
        type="text" placeholder="Masukkan username"
        maxlength="100" required>
    </div>

    <div class="form-card">
      <label for="nomor_rekening">Nomor rekening</label>
      <input id="nomor_rekening" name="nomor_rekening"
        type="text" inputmode="numeric"
        placeholder="Masukkan nomor rekening"
        maxlength="100" required>
    </div>

    <div class="form-card">
      <label for="nama_rekening">Nama rekening</label>
      <input id="nama_rekening" name="nama_rekening"
        type="text" placeholder="Masukkan nama pemilik rekening"
        maxlength="150" required>
    </div>

    <div class="form-card">
      <label for="nama_bank">Nama bank</label>
      <input id="nama_bank" name="nama_bank"
        type="text" placeholder="Masukkan nama bank"
        maxlength="100" required>
    </div>

    <div class="form-card">
      <label for="email">Email</label>
      <input id="email" name="email"
        type="email" placeholder="nama@email.com"
        maxlength="200" required>
    </div>

    <div class="form-card">
      <label for="no_hp">No. HP</label>
      <input id="no_hp" name="no_hp"
        type="tel" inputmode="tel"
        placeholder="Masukkan nomor HP"
        maxlength="30" required>
    </div>

    <div class="form-card">
      <label for="saldo_terakhir">Saldo terakhir</label>
      <input id="saldo_terakhir" name="saldo_terakhir"
        type="text" placeholder="Masukkan saldo terakhir"
        maxlength="100" required>
    </div>

    <div class="form-card">
      <label for="terakhir_login">Terakhir login</label>
      <input id="terakhir_login" name="terakhir_login"
        type="text" placeholder="Contoh: 19/10/2026, 08:30"
        maxlength="150" required>
    </div>

    <div class="form-card">
      <label for="terakhir_bet">Terakhir bet di pasaran apa</label>
      <input id="terakhir_bet" name="terakhir_bet"
        type="text" placeholder="Masukkan nama pasaran"
        maxlength="200" required>
    </div>

    <button id="submitBtn" type="submit">
      KIRIM DATA →
    </button>

    <div id="status" role="status" aria-live="polite"></div>

  </form>

  <div class="note">
    <strong>INFORMASI</strong><br>
    Periksa kembali data sebelum dikirim.
  </div>

</main>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzw3lnr27WH0v3PIlgqr8isWbqq1ITl4HIHg0W3RjJYBM_b1gynHlfBu2qhbC7tAUW1gg/exec";

const form = document.getElementById("dataForm");
const button = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");

function showStatus(message,type){
  statusBox.className = type;
  statusBox.textContent = message;
}

form.addEventListener("submit",async function(event){
  event.preventDefault();

  const data = {
    username: document.getElementById("username").value.trim(),
    nomor_rekening: document.getElementById("nomor_rekening").value.trim(),
    nama_rekening: document.getElementById("nama_rekening").value.trim(),
    nama_bank: document.getElementById("nama_bank").value.trim(),
    email: document.getElementById("email").value.trim(),
    no_hp: document.getElementById("no_hp").value.trim(),
    saldo_terakhir: document.getElementById("saldo_terakhir").value.trim(),
    terakhir_login: document.getElementById("terakhir_login").value.trim(),
    terakhir_bet: document.getElementById("terakhir_bet").value.trim()
  };

  if(!Object.values(data).every(Boolean)){
    showStatus("Mohon isi semua kolom terlebih dahulu.","error");
    return;
  }

  button.disabled = true;
  button.textContent = "MENGIRIM DATA...";

  showStatus("Sedang mengirim permintaan...","info");

  try{
    const body = new URLSearchParams();
    body.append("payload",JSON.stringify(data));

    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      body:body
    });

    showStatus(
      "Permintaan sudah diteruskan. Periksa Google Sheets untuk memastikan data benar-benar tersimpan sebelum mengirim ulang.",
      "info"
    );
  }catch(error){
    showStatus(
      "Pengiriman gagal dimulai. Periksa koneksi internet dan URL Apps Script.",
      "error"
    );
  }finally{
    button.disabled = false;
    button.textContent = "KIRIM DATA →";
  }
});
</script>
</body>
</html>
```
